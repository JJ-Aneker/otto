[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/generate"
  to = "/.netlify/functions/generate"
  status = 200

[[redirects]]
  from = "/api/wordpress"
  to = "/.netlify/functions/wordpress"
  status = 200

[[redirects]]
  from = "/api/jwt-login"
  to = "/.netlify/functions/jwt-login"
  status = 200

[[redirects]]
  from = "/api/media"
  to = "/.netlify/functions/media"
  status = 200
